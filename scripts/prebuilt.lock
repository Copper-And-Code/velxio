# What scripts/fetch-prebuilt.sh downloads: kind, URL, SHA-256, destination
# (relative to the repo). "tar" unpacks an archive's top directory into the
# destination; "file" copies the file there.
#
# Each asset is a release of the public repository it is built from (the
# source of a release is that repository at its tag):
#   QEMU, ESP32 libraries + ROMs   Copper-And-Code/qemu-picsimlab      (velxio-s3)
#   QEMU, RP2350 qemu-system-arm   Copper-And-Code/qemu-rp2040-pico    (rp2350)
#   VELXIO firmwares               Copper-And-Code/copper-and-code-mcu-boards (velxio)
# A new build: publish it there, then change its line here.

