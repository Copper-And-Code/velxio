name: Publish fork image (GHCR)

# The Copper and Code fork image: Dockerfile.standalone with the binaries of
# scripts/prebuilt.lock (QEMU ESP32 + RP2350 builds, VELXIO firmwares) put
# in prebuilt/ before the build, so the image runs the same versions as a
# Codespace or a local checkout. GHCR only, linux/amd64 only (the prebuilt
# QEMU builds are x86_64).
#
#   docker run -d -p 3080:80 ghcr.io/copper-and-code/velxio:stm32h7-renode
#
# docker-publish.yml stays as upstream has it (master, Docker Hub).

on:
  push:
    branches: [ "stm32h7-renode" ]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: docker-fork-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    if: github.repository == 'Copper-And-Code/velxio'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The ESP-IDF stage alone is several GB; the default runner has ~14 GB free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Fetch prebuilt binaries (scripts/prebuilt.lock)
        run: |
          scripts/fetch-prebuilt.sh
          ls -l prebuilt/qemu prebuilt/rp2350 prebuilt/stm32h7 frontend/public/firmware/micropython-esp32-4848s040-velxio.bin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5.10.0
        with:
          images: ghcr.io/copper-and-code/velxio
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          file: Dockerfile.standalone
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=fork
          cache-to: type=gha,mode=min,scope=fork

      - name: Smoke test the image
        run: |
          img=ghcr.io/copper-and-code/velxio:sha-${GITHUB_SHA::7}
          docker run --rm --entrypoint sh "$img" -c '
            set -e
            ls -l /app/lib/libqemu-xtensa.so /app/lib/libqemu-riscv32.so /app/lib/qemu-system-arm \
                  /app/lib/stm32h7/firmware.elf /app/lib/rp2350/waveshare-rp2350-lcd4-velxio.uf2
            cat /app/lib/SOURCE-*.txt | grep -i commit
            /app/lib/qemu-system-arm -machine help | grep -q raspi-pico2
            python3 -c "import ctypes; ctypes.CDLL(\"/app/lib/libqemu-xtensa.so\"); ctypes.CDLL(\"/app/lib/libqemu-riscv32.so\")"
            test -f /usr/share/nginx/html/firmware/micropython-esp32-4848s040-velxio.bin
            renode --version
          '
